<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d1a" />
  <title>Yogalates Form</title>
  <meta name="description" content="Breathe. Move. Flow. A calm space for people who love yoga." />
  <style>
    :root {
      --bg: #0b0d1a;
      --bg-2: #12142b;
      --ink: #f4f1ec;
      --muted: rgba(244, 241, 236, 0.62);
      --c1: #ff7a59;   /* warm coral */
      --c2: #ff477e;   /* rose */
      --c3: #ffb26b;   /* amber */
      --c4: #7b8cff;   /* soft indigo */
      --ring: rgba(255, 122, 89, 0.45);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- Animated gradient mesh background ---------- */
    .mesh {
      position: fixed;
      inset: -20%;
      z-index: 0;
      filter: blur(60px) saturate(1.15);
      opacity: 0.9;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }
    .blob.b1 { width: 46vmax; height: 46vmax; left: -8%;  top: -12%; background: radial-gradient(circle at 30% 30%, var(--c1), transparent 62%); animation: drift1 22s var(--ease) infinite alternate; }
    .blob.b2 { width: 42vmax; height: 42vmax; right: -10%; top: 4%;   background: radial-gradient(circle at 60% 40%, var(--c2), transparent 60%); animation: drift2 26s var(--ease) infinite alternate; }
    .blob.b3 { width: 40vmax; height: 40vmax; left: 18%;  bottom: -18%; background: radial-gradient(circle at 50% 50%, var(--c4), transparent 60%); animation: drift3 30s var(--ease) infinite alternate; }
    .blob.b4 { width: 34vmax; height: 34vmax; right: 6%;  bottom: -12%; background: radial-gradient(circle at 40% 60%, var(--c3), transparent 62%); animation: drift1 28s var(--ease) infinite alternate-reverse; }

    @keyframes drift1 { to { transform: translate3d(8%, 10%, 0) scale(1.15); } }
    @keyframes drift2 { to { transform: translate3d(-10%, 6%, 0) scale(1.1); } }
    @keyframes drift3 { to { transform: translate3d(6%, -8%, 0) scale(1.2); } }

    /* subtle grain / vignette on top */
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(120% 120% at 50% 40%, transparent 40%, rgba(6, 7, 16, 0.55) 100%),
        linear-gradient(180deg, rgba(11,13,26,0.35), rgba(11,13,26,0.65));
    }

    /* ---------- Floating lotus petals ---------- */
    .petals { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .petal {
      position: absolute;
      bottom: -8vh;
      width: 14px; height: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,178,107,0.5));
      border-radius: 80% 0 80% 0;
      opacity: 0;
      transform: rotate(45deg);
      animation: rise linear infinite;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
    }
    @keyframes rise {
      0%   { transform: translateY(0) rotate(45deg) scale(0.7); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-118vh) rotate(405deg) scale(1); opacity: 0; }
    }

    /* ---------- Layout ---------- */
    .stage {
      position: relative;
      z-index: 3;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(22px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      gap: clamp(22px, 4vh, 42px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(11px, 2.6vw, 13px);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s var(--ease) 0.15s forwards;
    }
    .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c1); box-shadow: 0 0 12px var(--c1); animation: twinkle 2.6s ease-in-out infinite; }

    /* ---------- Breathing orb + figure ---------- */
    .orb-wrap {
      position: relative;
      width: clamp(230px, 60vmin, 420px);
      height: clamp(230px, 60vmin, 420px);
      display: grid;
      place-items: center;
      opacity: 0;
      animation: fadeIn 1.4s var(--ease) 0.2s forwards;
    }
    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .orb-ring.pulse { animation: breathe 8s ease-in-out infinite; }
    .orb-ring.pulse.delay { animation-delay: -4s; opacity: 0.5; }

    .orb {
      position: relative;
      width: 62%;
      height: 62%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), transparent 45%),
        conic-gradient(from 120deg, var(--c3), var(--c2), var(--c4), var(--c1), var(--c3));
      box-shadow: 0 0 60px var(--ring), inset 0 0 40px rgba(255,255,255,0.25);
      animation: breathe 8s ease-in-out infinite, spin 26s linear infinite;
      filter: saturate(1.1);
    }
    /* meditating figure silhouette centered in orb */
    .figure {
      position: absolute;
      width: 42%;
      height: auto;
      z-index: 2;
      fill: rgba(11, 13, 26, 0.82);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.25));
      animation: floatY 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.86); }
      45%      { transform: scale(1.06); }
      55%      { transform: scale(1.06); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes floatY { 0%,100% { transform: translateY(3px); } 50% { transform: translateY(-3px); } }

    /* breathing guide word */
    .breath-cue {
      position: absolute;
      bottom: -6px;
      font-size: clamp(10px, 2.4vw, 12px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      animation: cue 8s ease-in-out infinite;
    }
    @keyframes cue {
      0%, 100% { opacity: 0; }
      12%, 40% { opacity: 0.9; }
      50% { opacity: 0.9; }
      60%, 90% { opacity: 0.35; }
    }

    /* ---------- Headline ---------- */
    .title {
      font-size: clamp(34px, 9vw, 82px);
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0;
      animation: fadeUp 1s var(--ease) 0.35s forwards;
    }
    .title .grad {
      background: linear-gradient(100deg, var(--c3), var(--c2) 45%, var(--c1) 70%, var(--c4));
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 6s linear infinite;
    }

    /* ---------- loading state (while doGet resolves) ---------- */
    .loadbar {
      display: inline-block;
      width: 180px; max-width: 62vw; height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
      vertical-align: middle;
    }
    .loadbar::after {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--c1), var(--c3), transparent);
      animation: loadslide 1.1s var(--ease) infinite;
    }
    @keyframes loadslide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

    .btnspin {
      display: none;
      width: 15px; height: 15px;
      border: 2px solid rgba(26, 18, 4, 0.3);
      border-top-color: #1a1204;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 8px;
    }
    .cta.is-loading .btnspin { display: inline-block; }
    .cta:disabled { opacity: 0.7; cursor: progress; }
    .heart {
      display: inline-block;
      color: var(--c2);
      -webkit-text-fill-color: var(--c2);
      animation: beat 1.6s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.28); }
      30% { transform: scale(1); }
      45% { transform: scale(1.18); }
    }
    @keyframes shine { to { background-position: 200% center; } }

    .subtitle {
      max-width: 34ch;
      font-size: clamp(15px, 3.6vw, 19px);
      line-height: 1.6;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 1s var(--ease) 0.5s forwards;
    }

    /* ---------- Center CTA button ---------- */
    .cta {
      position: relative;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: clamp(15px, 3.6vw, 17px);
      letter-spacing: 0.01em;
      color: #1a1204;
      padding: clamp(15px, 2.4vh, 19px) clamp(30px, 7vw, 46px);
      border-radius: 999px;
      background: linear-gradient(100deg, var(--c3), var(--c1) 55%, var(--c2));
      background-size: 180% auto;
      box-shadow: 0 10px 30px rgba(255, 100, 90, 0.35), inset 0 0 0 1px rgba(255,255,255,0.25);
      overflow: hidden;
      isolation: isolate;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), background-position 0.6s var(--ease);
      opacity: 0;
      animation: fadeUp 1s var(--ease) 0.65s forwards, floatBtn 6s ease-in-out 1.6s infinite;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .cta:hover, .cta:focus-visible {
      transform: translateY(-3px) scale(1.03);
      background-position: 100% center;
      box-shadow: 0 16px 42px rgba(255, 100, 90, 0.5), inset 0 0 0 1px rgba(255,255,255,0.35);
      outline: none;
    }
    .cta:active { transform: translateY(-1px) scale(0.99); }
    /* animated sheen sweeping across */
    .cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
      transform: translateX(-120%);
      animation: sheen 4.5s ease-in-out 2s infinite;
      z-index: -1;
    }
    @keyframes sheen { 0% { transform: translateX(-120%); } 22%, 100% { transform: translateX(120%); } }
    /* pulsing halo ring behind the button */
    .cta-halo {
      position: relative;
      display: inline-grid;
      place-items: center;
      opacity: 0;
      animation: fadeIn 1s var(--ease) 0.65s forwards;
    }
    .cta-halo::before, .cta-halo::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      border: 1px solid var(--ring);
      inset: 0;
      animation: halo 3s ease-out infinite;
      pointer-events: none;
    }
    .cta-halo::after { animation-delay: 1.5s; }
    @keyframes halo {
      0%   { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    /* click ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: scale(0);
      animation: rippleAnim 0.65s ease-out;
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(3.2); opacity: 0; } }

    .scroll-hint {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      z-index: 3;
      opacity: 0;
      animation: fadeIn 1s var(--ease) 1.2s forwards;
    }

    /* ---------- shared keyframes ---------- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes floatBtn { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    /* toast shown on click */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 12%;
      transform: translate(-50%, 20px);
      background: rgba(20, 22, 44, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--ink);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
      .orb { transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- animated background -->
  <div class="mesh" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main class="stage">
    <div class="orb-wrap" aria-hidden="true">
      <div class="orb-ring pulse"></div>
      <div class="orb-ring pulse delay"></div>
      <div class="orb">
        <!-- meditating figure -->
        <svg class="figure" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- head -->
          <circle cx="50" cy="26" r="9" />
          <!-- body / torso -->
          <path d="M50 36
                   c-8 0 -13 6 -13 14
                   c0 5 2 9 5 12
                   l-19 8
                   c-3 1 -3 6 1 6
                   h52
                   c4 0 4 -5 1 -6
                   l-19 -8
                   c3 -3 5 -7 5 -12
                   c0 -8 -5 -14 -13 -14 z" />
          <!-- folded legs (lotus) -->
          <path d="M22 76 q28 -14 56 0 q-28 12 -56 0 z" />
        </svg>
      </div>
    </div>

    <h1 class="title">Yoga<span class="grad">lates</span></h1>
    <p class="subtitle" id="subtitle"><span class="loadbar"></span></p>
    <span class="cta-halo" id="registerWrap">
      <button class="cta is-loading" id="startBtn" type="button" disabled>
        <span class="btnspin"></span><span id="btnLabel">Memuat…</span>
      </button>
    </span>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Breathe in… hold… breathe out 🧘</div>

  <script>
    // The "Daftar" button opens the registration form.
    var FORM_PAGE = 'form.html';

    // Apps Script Web App /exec URL (same one form.html posts to).
    var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwlyOYefrhKdLgf1wlldajRZoBo1TXr5Tw640te1b13jvwgMQm0IpHQLXoHo7tQBYNf_g/exec';

    // ---- call doGet() once: fill subtitle (Theme / Date - Location) + button count ----
    (function () {
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      // format a date value as dd/mm/yyyy; if parsing fails, return it unchanged
      function fmtDate(v) {
        var s = String(v == null ? '' : v).trim();
        if (!s) return '';
        var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/); // Code.gs sends yyyy-mm-dd for date cells
        if (iso) return iso[3] + '/' + iso[2] + '/' + iso[1];
        var d = new Date(s);
        if (!isNaN(d.getTime())) {
          var dd = ('0' + d.getDate()).slice(-2);
          var mm = ('0' + (d.getMonth() + 1)).slice(-2);
          return dd + '/' + mm + '/' + d.getFullYear();
        }
        return s; // could not parse -> show as-is
      }

      var btn = document.getElementById('startBtn');
      var btnLabel = document.getElementById('btnLabel');

      // leave loading state: stop spinner and enable the button
      function stopLoading(label) {
        btn.classList.remove('is-loading');
        btn.disabled = false;
        btnLabel.textContent = label;
      }

      fetch(ENDPOINT, { method: 'GET' })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var cfg = (data && data.config) ? data.config : {};
          var theme = cfg['Theme'] ? String(cfg['Theme']).trim() : '';
          var date = fmtDate(cfg['Date']);
          var loc = cfg['Location'] ? String(cfg['Location']).trim() : '';
          var when = [date, loc].filter(Boolean).join(' - ');

          // subtitle: Theme on line 1, "Date - Location" on line 2 — empty parts skipped
          var html = '';
          if (theme) html += '<span style="display:block;color:var(--ink);font-weight:600;">' + esc(theme) + '</span>';
          if (when) html += '<span style="display:block;margin-top:6px;">' + esc(when) + '</span>';
          document.getElementById('subtitle').innerHTML = html; // clears the loading bar

          // button: DAFTAR (MAX/Current)
          if (data && typeof data.max !== 'undefined') {
            stopLoading('DAFTAR (' + data.max + '/' + data.registered + ')');
          } else {
            stopLoading('Daftar');
          }
        })
        .catch(function (err) {
          console.warn('config load failed', err);
          // fail gracefully: clear loading UI, keep the button usable
          document.getElementById('subtitle').innerHTML = '';
          stopLoading('Daftar');
        });
    })();

    // ---- floating petals ----
    (function () {
      var layer = document.getElementById('petals');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var count = reduce ? 0 : (window.innerWidth < 640 ? 10 : 18);
      for (var i = 0; i < count; i++) {
        var p = document.createElement('span');
        p.className = 'petal';
        var size = 8 + Math.random() * 12;
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.width = size + 'px';
        p.style.height = (size * 1.6) + 'px';
        p.style.animationDuration = (12 + Math.random() * 12) + 's';
        p.style.animationDelay = (-Math.random() * 20) + 's';
        p.style.opacity = 0.4 + Math.random() * 0.5;
        layer.appendChild(p);
      }
    })();

    // ---- CTA ripple + redirect ----
    (function () {
      var btn = document.getElementById('startBtn');

      btn.addEventListener('click', function (e) {
        var rect = btn.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        var x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
        var y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        btn.appendChild(ripple);

        // let the ripple play briefly, then open the form
        setTimeout(function () { window.location.href = FORM_PAGE; }, 220);
      });
    })();
  </script>
</body>
</html>
